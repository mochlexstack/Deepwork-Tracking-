<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Work Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #eab308;
      --silver: #94a3b8;
      --bronze: #d97706;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2.25rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 1rem; }
    .leaderboard-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .rank-name { display: flex; align-items: center; gap: 1rem; }
    .rank-badge {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; background: var(--border);
    }
    .rank-1 .rank-badge { background: var(--gold); color: #000; }
    .rank-2 .rank-badge { background: var(--silver); color: #000; }
    .rank-3 .rank-badge { background: var(--bronze); color: #fff; }
    .user-info h3 { font-size: 1.15rem; font-weight: 700; }
    .user-info span { font-size: 0.85rem; color: var(--text-muted); }
    .stats { display: flex; gap: 2rem; text-align: right; }
    .stat-box .val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .stat-box .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .feed { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .feed h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Deep Work Live Leaderboard</h1>
      <p class="subtitle">Real-time deep work sessions & accountability tracker</p>
    </header>

    <div class="leaderboard-grid" id="leaderboard">
      <p style="text-align:center; color:var(--text-muted);">Loading live rankings...</p>
    </div>

    <div class="feed">
      <h2>Recent Session Feed</h2>
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Name</th>
            <th>Category</th>
            <th>Deliverable</th>
            <th>Distractions</th>
          </tr>
        </thead>
        <tbody id="session-feed">
          <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">Fetching responses...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Replace with your Google Sheets Published CSV link:
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTnGFKxe_SzQw5EzArsg6Hfbf-R5mOgVA9wigsN6ru6C_--oFta6FaUMjzLE_x7FSBK1Fr6Jj3ENx14/pub?gid=472028699&single=true&output=csv';

    function loadData() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          processData(results.data);
        },
        error: function(err) {
          document.getElementById('leaderboard').innerHTML = 
            `<p style="text-align:center; color:#ef4444;">Failed to fetch data. Check your published CSV link.</p>`;
        }
      });
    }

    function processData(rows) {
      const users = {};
      
      rows.forEach(row => {
        // Automatically find column values based on typical Google Form naming
        const name = row['Participant Name'] || row['Name'] || Object.values(row)[1] || 'Unknown';
        const distractions = parseInt(row['Number of Distractions'] || Object.values(row)[4] || 0) || 0;
        
        if (!users[name]) {
          users[name] = { name: name, hours: 0, distractions: 0 };
        }
        users[name].hours += 1; // Each form submission = 1 completed deep work hour
        users[name].distractions += distractions;
      });

      const sortedUsers = Object.values(users).sort((a, b) => b.hours - a.hours);

      // Render Leaderboard Cards
      const leaderboardEl = document.getElementById('leaderboard');
      leaderboardEl.innerHTML = sortedUsers.map((u, i) => `
        <div class="card rank-${i + 1}">
          <div class="rank-name">
            <div class="rank-badge">${i + 1}</div>
            <div class="user-info">
              <h3>${u.name}</h3>
              <span>${u.distractions} total distractions recorded</span>
            </div>
          </div>
          <div class="stats">
            <div class="stat-box">
              <div class="val">${u.hours}h</div>
              <div class="label">Hours Logged</div>
            </div>
          </div>
        </div>
      `).join('');

      // Render Recent Feed (Latest 8 entries)
      const feedEl = document.getElementById('session-feed');
      const recentRows = rows.slice(-8).reverse();
      feedEl.innerHTML = recentRows.map(r => {
        const timestamp = Object.values(r)[0] || '';
        const name = r['Participant Name'] || Object.values(r)[1] || '';
        const cat = r['Category'] || Object.values(r)[2] || '';
        const task = r['Tasks Completed in Detail'] || Object.values(r)[3] || '';
        const dist = r['Number of Distractions'] || Object.values(r)[4] || '0';
        return `
          <tr>
            <td>${timestamp.split(' ')[0]}</td>
            <td><strong>${name}</strong></td>
            <td>${cat}</td>
            <td>${task}</td>
            <td>${dist}</td>
          </tr>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
