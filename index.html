<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Work Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #eab308;
      --silver: #94a3b8;
      --bronze: #d97706;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 1050px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2.25rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 1rem; }
    
    /* Time Filter Buttons */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .leaderboard-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .rank-name { display: flex; align-items: center; gap: 1rem; }
    .rank-badge {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; background: var(--border);
    }
    .rank-1 .rank-badge { background: var(--gold); color: #000; }
    .rank-2 .rank-badge { background: var(--silver); color: #000; }
    .rank-3 .rank-badge { background: var(--bronze); color: #fff; }
    .user-info h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.2rem; }
    .user-meta { display: flex; gap: 0.6rem; font-size: 0.8rem; color: var(--text-muted); flex-wrap: wrap; }
    .meta-tag { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .stats { display: flex; gap: 2rem; text-align: right; }
    .stat-box .val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .stat-box .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    
    .feed { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; overflow-x: auto; }
    .feed h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text); }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    .pill { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .pill-green { background: #166534; color: #bbf7d0; }
    .pill-yellow { background: #854d0e; color: #fef08a; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Deep Work Live Leaderboard</h1>
      <p class="subtitle">Real-time deep work sessions & accountability tracker</p>
    </header>

    <!-- Time Period Filter Bar -->
    <div class="filter-bar">
      <button class="filter-btn" onclick="setPeriod('daily')">Daily (Today)</button>
      <button class="filter-btn" onclick="setPeriod('weekly')">Weekly (Last 7 Days)</button>
      <button class="filter-btn" onclick="setPeriod('monthly')">Monthly (Last 30 Days)</button>
      <button class="filter-btn" onclick="setPeriod('quarterly')">Quarterly (90 Days)</button>
      <button class="filter-btn" onclick="setPeriod('annually')">Annually (365 Days)</button>
      <button class="filter-btn active" onclick="setPeriod('all')">All Time</button>
    </div>

    <div class="leaderboard-grid" id="leaderboard">
      <p style="text-align:center; color:var(--text-muted);">Loading live rankings...</p>
    </div>

    <div class="feed">
      <h2>Recent Session Feed</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Participant</th>
            <th>Wake Up</th>
            <th>1st Hour Finished</th>
            <th>Category</th>
            <th>Deliverable / Task</th>
            <th>Auto-Suggestion</th>
          </tr>
        </thead>
        <tbody id="session-feed">
          <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Fetching responses...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTnGFKxe_SzQw5EzArsg6Hfbf-R5mOgVA9wigsN6ru6C_--oFta6FaUMjzLE_x7FSBK1Fr6Jj3ENx14/pub?gid=472028699&single=true&output=csv';

    const DISPLAY_NAMES = {
      'alex@example.com': 'Alex'
    };

    let rawDataRows = [];
    let currentPeriod = 'all';

    function formatEmailToName(email) {
      if (!email || !email.includes('@')) return email || 'Unknown';
      if (DISPLAY_NAMES[email.toLowerCase()]) return DISPLAY_NAMES[email.toLowerCase()];

      const userHandle = email.split('@')[0];
      return userHandle
        .replace(/[._-]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function getFormValue(row, keywords, exclude = []) {
      const keys = Object.keys(row);
      for (const k of keys) {
        const lower = k.trim().toLowerCase();
        const matches = keywords.some(w => lower.includes(w));
        const excluded = exclude.some(w => lower.includes(w));
        if (matches && !excluded && row[k] !== undefined && String(row[k]).trim() !== '') {
          return String(row[k]).trim();
        }
      }
      return '';
    }

    // Helper: Resolves participant name by checking form choice first, then email
    function resolveParticipantName(row) {
      // 1. Direct match on "Who is answering", "Who's answering", "Participant", "Name"
      const selectedName = getFormValue(row, [
        'who is answering', 
        "who's answering", 
        'whos answering', 
        'who are you', 
        'participant name', 
        'your name', 
        'participant', 
        'member'
      ], ['wake', 'first', 'hour', 'email']);

      if (selectedName && selectedName !== '') {
        return selectedName;
      }

      // 2. Fallback to Email if no name question was answered
      const email = getFormValue(row, ['email', 'username']);
      if (email) {
        return formatEmailToName(email);
      }

      // 3. Fallback to generic "name" field or unknown
      const fallbackName = getFormValue(row, ['name'], ['wake', 'first', 'hour', 'email']);
      return fallbackName || 'Unknown';
    }

    function parseRowDate(row) {
      const dateStr = getFormValue(row, ['timestamp', 'date', 'time']) || Object.values(row)[0] || '';
      if (!dateStr) return null;
      
      const d = new Date(dateStr);
      if (!isNaN(d.getTime())) return d;
      
      const parts = dateStr.split(/[\/\- :]/);
      if (parts.length >= 3) {
        const year = parts[2].length === 4 ? parts[2] : parts[0];
        const month = parts[1] - 1;
        const day = parts[2].length === 4 ? parts[0] : parts[2];
        const parsed = new Date(year, month, day);
        if (!isNaN(parsed.getTime())) return parsed;
      }
      return null;
    }

    function filterRowsByPeriod(rows, period) {
      if (period === 'all') return rows;
      
      const now = new Date();
      return rows.filter(row => {
        const rowDate = parseRowDate(row);
        if (!rowDate) return true;

        const diffTime = now - rowDate;
        const diffDays = diffTime / (1000 * 60 * 60 * 24);

        if (period === 'daily') {
          return rowDate.toDateString() === now.toDateString();
        } else if (period === 'weekly') {
          return diffDays >= 0 && diffDays <= 7;
        } else if (period === 'monthly') {
          return diffDays >= 0 && diffDays <= 30;
        } else if (period === 'quarterly') {
          return diffDays >= 0 && diffDays <= 90;
        } else if (period === 'annually') {
          return diffDays >= 0 && diffDays <= 365;
        }
        return true;
      });
    }

    function setPeriod(period) {
      currentPeriod = period;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(period)) {
          btn.classList.add('active');
        }
      });
      renderDashboard();
    }

    async function loadData() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            if (!results.data || results.data.length === 0) {
              document.getElementById('leaderboard').innerHTML = 
                `<p style="text-align:center; color:var(--text-muted);">No form submissions found yet.</p>`;
              return;
            }
            rawDataRows = results.data;
            renderDashboard();
          },
          error: function(err) {
            console.error("PapaParse Error:", err);
            document.getElementById('leaderboard').innerHTML = 
              `<p style="text-align:center; color:#ef4444;">Error parsing data from spreadsheet.</p>`;
          }
        });
      } catch (error) {
        console.error("Fetch Error:", error);
        document.getElementById('leaderboard').innerHTML = 
          `<div style="text-align:center; color:#ef4444; padding: 1.5rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);">
            <p><strong>Failed to fetch data.</strong></p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">
              Make sure you are viewing this page on your live GitHub Pages (https://) URL.
            </p>
          </div>`;
      }
    }

    function processData(rows) {
      const users = {};

      rows.forEach(row => {
        const displayName = resolveParticipantName(row);
        if (!displayName || displayName === 'Unknown') return;

        // Count checklist completions
        const checklistKeys = ['10x', 'motivation', 'top 5', '2.0', 'thought habits'];
        let checks = 0;
        Object.keys(row).forEach(k => {
          const lower = k.toLowerCase();
          if (checklistKeys.some(w => lower.includes(w))) {
            const val = String(row[k]).trim().toLowerCase();
            if (val === 'true' || val === 'yes' || val === '1') checks++;
          }
        });

        const wakeTime = getFormValue(row, ['wake up', 'woken']);
        const firstHour = getFormValue(row, ['complete your first', 'first deep work']);

        if (!users[displayName]) {
          users[displayName] = { 
            name: displayName, 
            hours: 0, 
            checklistScore: 0,
            latestWake: wakeTime || '-',
            latestFirstHour: firstHour || '-'
          };
        }
        users[displayName].hours += 1;
        users[displayName].checklistScore += checks;
        if (wakeTime) users[displayName].latestWake = wakeTime;
        if (firstHour) users[displayName].latestFirstHour = firstHour;
      });

      const sortedUsers = Object.values(users).sort((a, b) => b.hours - a.hours);

      // Render Leaderboard Cards
      const leaderboardEl = document.getElementById('leaderboard');
      if (sortedUsers.length === 0) {
        leaderboardEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding: 2rem;">No deep work hours logged for this period.</p>`;
      } else {
        leaderboardEl.innerHTML = sortedUsers.map((u, i) => {
          const avgChecklist = u.hours > 0 ? (u.checklistScore / (u.hours * 5) * 100).toFixed(0) : 0;
          return `
            <div class="card rank-${i + 1}">
              <div class="rank-name">
                <div class="rank-badge">${i + 1}</div>
                <div class="user-info">
                  <h3>${u.name}</h3>
                  <div class="user-meta">
                    <span class="meta-tag">☀️ Wake: ${u.latestWake}</span>
                    <span class="meta-tag">⏱️ 1st Hr Done: ${u.latestFirstHour}</span>
                    <span class="meta-tag">🎯 Routine: ${avgChecklist}%</span>
                  </div>
                </div>
              </div>
              <div class="stats">
                <div class="stat-box">
                  <div class="val">${u.hours}h</div>
                  <div class="label">Hours (${currentPeriod})</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Render Feed Table
      const feedEl = document.getElementById('session-feed');
      const validRows = rawDataRows.filter(r => Object.values(r).some(v => v !== ''));
      const recentRows = validRows.slice(-10).reverse();

      feedEl.innerHTML = recentRows.map(r => {
        const dateVal = getFormValue(r, ['date', 'timestamp']) || Object.values(r)[0] || '';
        const feedName = resolveParticipantName(r);

        const wake = getFormValue(r, ['wake up', 'woken']) || '-';
        const firstHr = getFormValue(r, ['complete your first', 'first deep work']) || '-';
        const cat = getFormValue(r, ['category']) || '-';
        const task = getFormValue(r, ['what did you do', 'during this hour', 'task', 'deliverable']) || '-';

        const checklistKeys = ['10x', 'motivation', 'top 5', '2.0', 'thought habits'];
        let checks = 0;
        Object.keys(r).forEach(k => {
          const lower = k.toLowerCase();
          if (checklistKeys.some(w => lower.includes(w))) {
            const val = String(r[k]).trim().toLowerCase();
            if (val === 'true' || val === 'yes' || val === '1') checks++;
          }
        });

        const pillClass = checks >= 4 ? 'pill-green' : 'pill-yellow';

        return `
          <tr>
            <td>${dateVal.split(' ')[0]}</td>
            <td><strong>${feedName}</strong></td>
            <td>${wake}</td>
            <td>${firstHr}</td>
            <td>${cat}</td>
            <td>${task}</td>
            <td><span class="pill ${pillClass}">${checks}/5 Done</span></td>
          </tr>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
