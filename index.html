    @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f8fafc;
      --text-muted: #8493a8;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --gold-glow: #fbbf24;
      --danger: #ef4444;
      --success: #10b981;
      --border: #222f49;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 12.5rem 1rem; 
      min-height: 100vh; 
    }
    .container { max-width: 1080px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { 
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 2.4rem; 
      font-weight: 900; 
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 0.3rem;
    }
    h1 span { color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* Stakes Banner */
    .stakes-banner {
      background: linear-gradient(135deg, #182238, #1e1b2e);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.2rem;
    }
    .stakes-info h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold-glow);
      margin-bottom: 0.35rem;
    }
    .stakes-countdown { text-align: right; }
    .timer-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
    }
    .timer-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .stakes-standings { display: flex; gap: 1rem; font-size: 0.82rem; margin-top: 0.4rem; }
    .badge-win { color: var(--gold-glow); font-weight: 800; }
    .badge-lose { color: var(--danger); font-weight: 800; }

    /* Controls */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-bar { display: flex; gap: 0.4rem; flex-wrap: wrap; }
