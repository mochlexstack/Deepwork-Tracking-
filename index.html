<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Work Live Arena</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f8fafc;
      --text-muted: #8493a8;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --gold-glow: #fbbf24;
      --danger: #ef4444;
      --success: #10b981;
      --border: #222f49;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 12.5rem 1rem; 
      min-height: 100vh; 
    }
    .container { max-width: 1080px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { 
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 2.4rem; 
      font-weight: 900; 
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 0.3rem;
    }
    h1 span { color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* Stakes Banner */
    .stakes-banner {
      background: linear-gradient(135deg, #182238, #1e1b2e);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.2rem;
    }
    .stakes-info h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold-glow);
      margin-bottom: 0.35rem;
    }
    .stakes-countdown { text-align: right; }
    .timer-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
    }
    .timer-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .stakes-standings { display: flex; gap: 1rem; font-size: 0.82rem; margin-top: 0.4rem; }
    .badge-win { color: var(--gold-glow); font-weight: 800; }
    .badge-lose { color: var(--danger); font-weight: 800; }

    /* Controls */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-bar { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #090d16; border-color: var(--accent); }

    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.15s;
    }
    .btn-action:hover { transform: translateY(-2px); }

    /* Leaderboard Cards */
    .leaderboard-grid { display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 2.5rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.25rem;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card.rank-1 { border-color: rgba(245, 158, 11, 0.45); }
    .card.has-pushup-debt {
      border-color: rgba(239, 68, 68, 0.6) !important;
      background: linear-gradient(135deg, #241319, #131b2e);
    }
    
    .rank-name { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 280px; }
    .avatar-wrapper {
      position: relative;
      width: 52px; height: 52px;
      background: #090d16;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.8rem;
    }
    .rank-tag {
      position: absolute;
      bottom: -3px; right: -3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--border);
      color: #fff;
    }
    .rank-1 .rank-tag { background: var(--gold); color: #000; }

    .user-info { flex: 1; }
    .user-info h3 { font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    .user-title-badge { font-size: 0.75rem; font-weight: 700; color: var(--accent); padding: 1px 6px; border-radius: 4px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); }

    /* EXP Progress Bar */
    .card-exp-wrap { margin: 0.35rem 0 0.45rem 0; max-width: 320px; }
    .card-exp-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .card-exp-bg { width: 100%; height: 6px; background: #090d16; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .card-exp-fill { height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); border-radius: 999px; }

    .user-meta { display: flex; gap: 0.45rem; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
    .meta-tag { background: rgba(56, 189, 248, 0.08); color: var(--accent); padding: 2px 7px; border-radius: 5px; border: 1px solid rgba(56, 189, 248, 0.2); }
    .meta-streak { background: rgba(249, 115, 22, 0.1); color: #fb923c; border-color: rgba(249, 115, 22, 0.3); font-weight: 700; }
    .meta-gold { background: rgba(245, 158, 11, 0.12); color: var(--gold-glow); border-color: rgba(245, 158, 11, 0.35); font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .meta-safe { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.35); font-weight: 800; }
    .meta-vulnerable { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.35); font-weight: 800; }
    .meta-debt { background: #ef4444; color: #fff; font-weight: 800; border-radius: 5px; padding: 2px 7px; cursor: pointer; }

    .stats { display: flex; gap: 1.8rem; text-align: right; }
    .stat-box .val { font-family: 'JetBrains Mono', monospace; font-size: 1.45rem; font-weight: 800; color: var(--accent); }
    .stat-box .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    
    .feed { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; overflow-x: auto; }
    .feed h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text); font-weight: 800; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 750px; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; }
    .pill { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .pill-green { background: #166534; color: #bbf7d0; }
    .pill-yellow { background: #854d0e; color: #fef08a; }
    .pill-hour { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }

    /* Bottom Player Dock */
    .player-dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.9) 0%, rgba(5, 7, 12, 0.98) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 0.65rem 1rem 0.85rem 1rem;
      z-index: 999;
      display: flex;
      justify-content: center;
    }
    .dock-container { display: flex; gap: 0.9rem; overflow-x: auto; max-width: 1150px; width: 100%; scrollbar-width: none; }
    .dock-container::-webkit-scrollbar { display: none; }
    .dock-card {
      flex: 1; min-width: 200px; max-width: 250px;
      background: linear-gradient(145deg, #141e33, #0c1322);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .dock-card-top { display: flex; align-items: center; gap: 0.6rem; }
    .dock-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: #090d16; flex-shrink: 0; }
    .dock-info { flex: 1; overflow: hidden; }
    .dock-name { font-weight: 800; font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis
