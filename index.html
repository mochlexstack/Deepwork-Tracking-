<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Work Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #eab308;
      --silver: #94a3b8;
      --bronze: #d97706;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2.25rem; font-weight: 800; color: var(--accent); margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 1rem; }
    .leaderboard-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .rank-name { display: flex; align-items: center; gap: 1rem; }
    .rank-badge {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; background: var(--border);
    }
    .rank-1 .rank-badge { background: var(--gold); color: #000; }
    .rank-2 .rank-badge { background: var(--silver); color: #000; }
    .rank-3 .rank-badge { background: var(--bronze); color: #fff; }
    .user-info h3 { font-size: 1.15rem; font-weight: 700; }
    .user-info span { font-size: 0.85rem; color: var(--text-muted); }
    .stats { display: flex; gap: 2rem; text-align: right; }
    .stat-box .val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .stat-box .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .feed { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .feed h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--text); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Deep Work Live Leaderboard</h1>
      <p class="subtitle">Real-time deep work sessions & accountability tracker</p>
    </header>

    <div class="leaderboard-grid" id="leaderboard">
      <p style="text-align:center; color:var(--text-muted);">Loading live rankings...</p>
    </div>

    <div class="feed">
      <h2>Recent Session Feed</h2>
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Participant</th>
            <th>Category</th>
            <th>Deliverable</th>
            <th>Distractions</th>
          </tr>
        </thead>
        <tbody id="session-feed">
          <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">Fetching responses...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTnGFKxe_SzQw5EzArsg6Hfbf-R5mOgVA9wigsN6ru6C_--oFta6FaUMjzLE_x7FSBK1Fr6Jj3ENx14/pub?gid=472028699&single=true&output=csv';

    // Optional: Map specific emails to custom display names
    const DISPLAY_NAMES = {
      'alex@example.com': 'Alex'
    };

    // ==========================================
    // 2. HELPER FUNCTIONS
    // ==========================================
    function formatEmailToName(email) {
      if (!email || !email.includes('@')) return email || 'Unknown';
      if (DISPLAY_NAMES[email.toLowerCase()]) return DISPLAY_NAMES[email.toLowerCase()];

      const userHandle = email.split('@')[0];
      return userHandle
        .replace(/[._-]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    // ==========================================
    // 3. FETCH & PARSE DATA
    // ==========================================
    async function loadData() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            if (!results.data || results.data.length === 0) {
              document.getElementById('leaderboard').innerHTML = 
                `<p style="text-align:center; color:var(--text-muted);">No form submissions found yet.</p>`;
              return;
            }
            processData(results.data);
          },
          error: function(err) {
            console.error("PapaParse Error:", err);
            document.getElementById('leaderboard').innerHTML = 
              `<p style="text-align:center; color:#ef4444;">Error parsing data from spreadsheet.</p>`;
          }
        });
      } catch (error) {
        console.error("Fetch Error:", error);
        document.getElementById('leaderboard').innerHTML = 
          `<div style="text-align:center; color:#ef4444; padding: 1.5rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);">
            <p><strong>Failed to fetch data.</strong></p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">
              Make sure you are viewing this page on your live <strong>GitHub Pages (https://)</strong> URL rather than opening the file locally on your computer.
            </p>
          </div>`;
      }
    }

    // ==========================================
    // 4. PROCESS & RENDER
    // ==========================================
    function processData(rows) {
      const users = {};

      rows.forEach(row => {
        const cleanRow = {};
        Object.keys(row).forEach(k => cleanRow[k.trim().toLowerCase()] = row[k]);

        // Flexible key matching for Email / Participant Name
        const emailKey = Object.keys(cleanRow).find(k => k.includes('email') || k.includes('username'));
        const nameKey = Object.keys(cleanRow).find(k => k.includes('name') || k.includes('participant') || k.includes('member'));

        let rawUser = '';
        let displayName = '';

        if (emailKey && cleanRow[emailKey]) {
          rawUser = cleanRow[emailKey].trim();
          displayName = formatEmailToName(rawUser);
        } else if (nameKey && cleanRow[nameKey]) {
          rawUser = cleanRow[nameKey].trim();
          displayName = rawUser;
        } else {
          rawUser = Object.values(row)[1] ? Object.values(row)[1].trim() : '';
          displayName = rawUser.includes('@') ? formatEmailToName(rawUser) : rawUser;
        }

        if (!rawUser || displayName === 'Unknown' || displayName === '') return;

        // Distraction count
        const distKey = Object.keys(cleanRow).find(k => k.includes('distraction'));
        const distractions = parseInt(distKey ? cleanRow[distKey] : 0) || 0;

        if (!users[rawUser]) {
          users[rawUser] = { name: displayName, identifier: rawUser, hours: 0, distractions: 0 };
        }
        users[rawUser].hours += 1; // 1 submission = 1 deep work hour
        users[rawUser].distractions += distractions;
      });

      const sortedUsers = Object.values(users).sort((a, b) => b.hours - a.hours);

      // Render Leaderboard Cards
      const leaderboardEl = document.getElementById('leaderboard');
      if (sortedUsers.length === 0) {
        leaderboardEl.innerHTML = `<p style="text-align:center; color:var(--text-muted);">No entries recorded yet.</p>`;
      } else {
        leaderboardEl.innerHTML = sortedUsers.map((u, i) => `
          <div class="card rank-${i + 1}">
            <div class="rank-name">
              <div class="rank-badge">${i + 1}</div>
              <div class="user-info">
                <h3>${u.name}</h3>
                <span>${u.distractions} total distractions recorded</span>
              </div>
            </div>
            <div class="stats">
              <div class="stat-box">
                <div class="val">${u.hours}h</div>
                <div class="label">Hours Logged</div>
              </div>
            </div>
          </div>
        `).join('');
      }

      // Render Feed Table
      const feedEl = document.getElementById('session-feed');
      const validRows = rows.filter(r => Object.values(r).some(v => v !== ''));
      const recentRows = validRows.slice(-8).reverse();

      feedEl.innerHTML = recentRows.map(r => {
        const cleanR = {};
        Object.keys(r).forEach(k => cleanR[k.trim().toLowerCase()] = r[k]);

        const values = Object.values(r);
        const timestamp = values[0] || '';

        const emailK = Object.keys(cleanR).find(k => k.includes('email') || k.includes('username'));
        const nameK = Object.keys(cleanR).find(k => k.includes('name') || k.includes('participant'));
        const catK = Object.keys(cleanR).find(k => k.includes('category'));
        const taskK = Object.keys(cleanR).find(k => k.includes('task') || k.includes('deliverable') || k.includes('completed') || k.includes('detail'));
        const distK = Object.keys(cleanR).find(k => k.includes('distraction'));

        let feedName = '-';
        if (emailK && cleanR[emailK]) feedName = formatEmailToName(cleanR[emailK].trim());
        else if (nameK && cleanR[nameK]) feedName = cleanR[nameK].trim();
        else if (values[1]) feedName = values[1].includes('@') ? formatEmailToName(values[1]) : values[1];

        const cat = catK ? cleanR[catK] : (values[3] || '-');
        const task = taskK ? cleanR[taskK] : (values[4] || '-');
        const dist = distK ? cleanR[distK] : (values[5] || '0');

        return `
          <tr>
            <td>${timestamp.split(' ')[0]}</td>
            <td><strong>${feedName}</strong></td>
            <td>${cat}</td>
            <td>${task}</td>
            <td>${dist}</td>
          </tr>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
